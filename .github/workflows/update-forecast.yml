name: Update Flu Forecast

# CDC releases ILINet data on Fridays around 11am ET (~16:00 UTC).
# We run Friday evenings UTC to pick up the new release, plus on-demand.
on:
  schedule:
    - cron: "0 22 * * 5"   # Friday 22:00 UTC
  workflow_dispatch:       # allow manual triggers from the Actions tab
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/update-forecast.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time. Without this, a scheduled run and a
# manual/push run can create competing deployments, which surfaces as
# "Deployment failed, try again later." Don't cancel in-progress runs — we
# want the forecast commit to finish rather than be interrupted mid-push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps for Prophet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forecast pipeline
        run: python -m src.forecast_pipeline

      - name: Commit updated forecasts & plots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly forecast update $(date -u +%Y-%m-%d)"
            # Another run may have pushed in the meantime; rebase before pushing.
            git pull --rebase --autostash origin main || true
            git push
          fi

      # Enable GitHub Pages and set its build source to "GitHub Actions" via the
      # API. This is what fixes the deploy errors: a 404 at deployment-create
      # time ("Ensure GitHub Pages has been enabled") and the "Deployment
      # failed, try again later" polling error both stem from Pages not being
      # configured for Actions-based builds. `enablement: true` makes the
      # workflow self-provisioning instead of relying on a manual Settings step.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site/ for GitHub Pages
        run: |
          mkdir -p site
          cp outputs/plots/forecast.html site/index.html
          cp outputs/plots/forecast.png site/ || true
          cp outputs/plots/decomposition.png site/ || true
          cp outputs/latest_run.json site/ || true
          # Tell Pages to serve files as-is (no Jekyll processing). Plotly
          # output and any underscore-prefixed files would otherwise be dropped.
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
