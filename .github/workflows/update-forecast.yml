name: Update Flu Forecast

# CDC releases ILINet data on Fridays around 11am ET (~16:00 UTC).
# We run Friday evenings UTC to pick up the new release, plus on-demand.
on:
  schedule:
    - cron: "0 22 * * 5"   # Friday 22:00 UTC
  workflow_dispatch:       # allow manual triggers from the Actions tab
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/update-forecast.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps for Prophet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forecast pipeline
        run: python -m src.forecast_pipeline

      - name: Commit updated forecasts & plots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly forecast update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Prepare site/ for GitHub Pages
        run: |
          mkdir -p site
          cp outputs/plots/forecast.html site/index.html
          cp outputs/plots/forecast.png site/ || true
          cp outputs/plots/decomposition.png site/ || true
          cp outputs/latest_run.json site/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
